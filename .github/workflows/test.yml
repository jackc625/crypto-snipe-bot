name: Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit
      - run: npm run test:integration
      - name: vi.mock specifier gate (SAFE-06)
        # SAFE-06: a moved file must not turn a mock into a silent no-op. AST check of
        # vi.mock / vi.doMock / vi.unmock / vi.doUnmock: each specifier must be a literal that
        # resolves to a real module from the file that contains the call. The deliberately
        # broken fixtures under test/fixtures/viMockGate are excluded from the suite scan.
        run: npm run check:vi-mock
      - name: Ban .todo test stubs
        run: |
          # D-09: Strict ban (NOT allowlist-with-reason). Use it.skip('reason: ...') instead.
          # WR-05: Removed `find test/ -name '*.todo*'` — Vitest's .todo test-stub form is
          # invoked via it.todo/test.todo/describe.todo method calls, NOT via filenames.
          # The find pattern would have flagged any documentation-style filename containing
          # `.todo` (e.g., `test/ROADMAP.todo.md`) which is not the intent of this guard.
          # WR-04: Bare `\.todo\s*\(` removed — it would match any property named `todo`
          # invoked as a function (e.g., `myObject.todo()` on unrelated code). The three
          # specific Vitest patterns below are sufficient and precise.
          if grep -rEn 'it\.todo\s*\(|test\.todo\s*\(|describe\.todo\s*\(' test/; then
            echo "ERROR: .todo() test-stub invocation found in test/. Use it.skip('reason: ...') instead."
            exit 1
          fi
      - name: Ban root-level operator-facing docs
        run: |
          # Phase 20 D-RUNBOOK-MOVE + D-BRIEFING-DELETE evergreen guard.
          # GOING-LIVE.md was moved to docs/operations/going-live.md in Phase 20.
          # HONEYPOT-SIM-BRIEFING.md was deleted in Phase 20 (Phase 18 D-BRIEFING-DISPOSITION
          # preserved its content in .planning/phases/18-honeypot-detection-rebuild/18-CONTEXT.md).
          # Re-introduction at the repo root would break the docs/operations/
          # canonical location and bypass operator handoff discoverability.
          # Uses 'test ! -e' (existence check; file or directory) per Plan 20-07
          # Task 3 vitest self-test contract; -e is strictly broader than -f.
          test ! -e GOING-LIVE.md || { echo "ERROR: GOING-LIVE.md reappeared at repo root. Move to docs/operations/going-live.md."; exit 1; }
          test ! -e HONEYPOT-SIM-BRIEFING.md || { echo "ERROR: HONEYPOT-SIM-BRIEFING.md reappeared at repo root. The Phase 18 honeypot rebuild superseded this briefing; the file is deleted permanently."; exit 1; }
      - name: TypeScript check (root tsconfig.json)
        run: npx tsc --noEmit -p tsconfig.json
      - name: TypeScript check (tsconfig.bot.json)
        run: npx tsc --noEmit -p tsconfig.bot.json
      - name: TypeScript check (dashboard/tsconfig.json)
        run: npx tsc --noEmit -p dashboard/tsconfig.json

  # ---------------------------------------------------------------------------
  # Plan 18-05 (HONEY-02) — contracts/** evergreen audit gate.
  #
  # The next three jobs (hardhat-compile / slither / mythril) only run when a
  # PR or push touches `contracts/**`. The `detect-contract-changes` job uses
  # the upstream `dorny/paths-filter` action (industry-standard for this
  # pattern) to set a single `contracts` output; the gated jobs depend on it
  # via `needs:` + an `if: needs.detect-contract-changes.outputs.contracts ==
  # 'true'` guard. This pattern keeps the test job above unchanged for non-
  # contract changes while locking the audit-bar evergreen for every future
  # contract edit (regression to a medium+ finding fails the build).
  #
  # PRESERVED: the `test` job above retains all Phase 17 evergreen guards
  # (`.todo` ban + `tsc --noEmit ×3`) per CONTEXT canonical refs line 303-304.
  # ---------------------------------------------------------------------------

  detect-contract-changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'

  hardhat-compile:
    runs-on: ubuntu-latest
    needs: detect-contract-changes
    if: needs.detect-contract-changes.outputs.contracts == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Hardhat compile (contracts/**)
        run: npx hardhat compile

  slither:
    runs-on: ubuntu-latest
    needs: [detect-contract-changes, hardhat-compile]
    if: needs.detect-contract-changes.outputs.contracts == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --legacy-peer-deps
      - name: Install slither-analyzer + solc-select
        run: |
          pip install --upgrade pip
          pip install slither-analyzer
          solc-select install 0.8.28
          solc-select use 0.8.28
      - name: Prepare reports directory
        run: mkdir -p reports
      - name: Slither --fail-medium on contracts/honeypot/HoneypotChecker.sol
        run: |
          slither contracts/honeypot/HoneypotChecker.sol \
            --solc-remaps "@openzeppelin/=node_modules/@openzeppelin/" \
            --exclude-informational \
            --exclude-low \
            --filter-paths "node_modules" \
            --json reports/slither-honeypot.json \
            --fail-medium

  mythril:
    runs-on: ubuntu-latest
    needs: [detect-contract-changes, hardhat-compile]
    if: needs.detect-contract-changes.outputs.contracts == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --legacy-peer-deps
      - name: Install mythril
        run: |
          pip install --upgrade pip
          pip install mythril
      - name: Prepare reports directory + solc-settings
        run: |
          mkdir -p reports
          cat > reports/solc-settings.json <<'JSON'
          {
            "remappings": ["@openzeppelin/=node_modules/@openzeppelin/"],
            "optimizer": { "enabled": false }
          }
          JSON
      - name: Mythril symbolic analysis on contracts/honeypot/HoneypotChecker.sol
        run: |
          myth analyze contracts/honeypot/HoneypotChecker.sol \
            --solc-json reports/solc-settings.json \
            --solc-args "--allow-paths node_modules" \
            --execution-timeout 300 \
            --max-depth 30 \
            -o json > reports/mythril-honeypot.json
      - name: Severity gate (scripts/check-mythril-report.ts — plan 18-03)
        run: npx ts-node scripts/check-mythril-report.ts reports/mythril-honeypot.json
